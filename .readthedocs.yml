# .readthedocs.yml
version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.12"
  commands:
    - pip install uv
    - uv sync --extra dev
    - sphinx-build -b html docs docs/_build/html

python:
  install:
    - method: pip
      path: .

sphinx:
  configuration: docs/conf.py
  builder: html
