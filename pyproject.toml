[build-system]
requires = ["uv_build<0.12"]
build-backend = "uv_build"

[project]
name = "sympy_matrices_random"
version = "0.1.1"
description = "A package for working with random matrices using SymPy"
readme = "README.rst"
requires-python = ">=3.10"
license = {text = "BSD-3-Clause"}
authors = [
    {name = "sonntagsgesicht", email = "sonntagsgesicht@icloud.com"}
]
keywords = ["sympy", "matrix", "random", "linear algebra"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "sympy>=1.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "sphinx>=7.0",
    "sphinx-rtd-theme>=1.3",
    "myst-parser>=2.0",
    "sphinx_math_dollar",
    "m2r2",
    "sphinx_copybutton",
    "furo",
    "sphinx_pytype_substitution",
    "twine"
]

[project.urls]
Homepage = "https://github.com/sonntagsgesicht/sympy-matrices-random"
Documentation = "https://sympy-matrices-random.readthedocs.io"
Repository = "https://github.com/sonntagsgesicht/sympy-matrices-random"

[dependency-groups]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "sphinx>=7.0",
    "sphinx-rtd-theme>=1.3",
    "myst-parser>=2.0",
]

[tool.pytest.ini_options]
# addopts = " --doctest-modules -v --cov=sympy_matrices_random --cov-report=term-missing --cov-report=html"
addopts = " --doctest-modules -v --cov=sympy_matrices_random --cov-report=term-missing"
testpaths = ["sympy_matrices_random", "tests"]

[tool.uv.build-backend]
module-name = "sympy_matrices_random"
module-root = ""
