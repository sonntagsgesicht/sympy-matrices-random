[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sympy_matrices_random"
version = "0.1.0"
description = "A package for working with random matrices using SymPy"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Jan-Philipp Hoffmann", email = ""}
]
keywords = ["sympy", "matrix", "random", "linear algebra"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "sympy>=1.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "sphinx>=7.0",
    "sphinx-rtd-theme>=1.3",
    "myst-parser>=2.0",
    "sphinx_math_dollar"
]

[project.urls]
Homepage = "https://github.com/yourusername/sympy-matrices-random"
Documentation = "https://sympy-matrices-random.readthedocs.io"
Repository = "https://github.com/yourusername/sympy-matrices-random"

[dependency-groups]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "sphinx>=7.0",
    "sphinx-rtd-theme>=1.3",
    "myst-parser>=2.0",
]

[tool.pytest.ini_options]
addopts = " --doctest-modules -v --cov=sympy_matrices_random --cov-report=term-missing --cov-report=html"
testpaths = ["sympy_matrices_random", "tests"]

[tool.hatch.build.targets.wheel]
packages = ["sympy_matrices_random"]
